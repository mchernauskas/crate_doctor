# Fallback metadata for older setuptools that cannot read pyproject.toml's [project]
# table. Without this, `pip install .` on an older Python quietly installs a package
# called UNKNOWN 0.0.0 with no `crate_doctor` command. Keep in sync with pyproject.toml.
[metadata]
name = crate-doctor
version = 0.9.0a4
description = Audit and repair a Rekordbox library from the command line
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
python_requires = >=3.9
py_modules = crate_doctor
install_requires =
    pyrekordbox>=0.4
    numpy>=1.20

[options.entry_points]
console_scripts =
    crate-doctor = crate_doctor:main
    crate_doctor = crate_doctor:main

[options.data_files]
share/crate_doctor = knowledge.json
